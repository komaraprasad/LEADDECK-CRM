name: tests

on:
  push:
  workflow_dispatch:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  postgres:
    timeout-minutes: 20
    # Same suite on Postgres (Neon). Needs the repo secret NEON_TEST_URL (a throwaway test database).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests on Postgres
        env:
          LEADDECK_TEST_PG_URL: ${{ secrets.NEON_TEST_URL }}
        run: |
          if [ -z "$LEADDECK_TEST_PG_URL" ]; then echo "::error::Add the repo secret NEON_TEST_URL first"; exit 1; fi
          python -m pytest -p no:cacheprovider -rf --tb=short --durations=10 -v
